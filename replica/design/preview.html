<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hobel Primitives</title>
<link rel="stylesheet" href="tokens.css">
<style>
  /* Isolated primitives check for replica-design. Plain HTML/CSS on tokens.css;
     the React versions in replica-build use the same classes' token mapping. */
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); font-size: var(--text-sm); line-height: var(--leading-sm); background: #0e0f11; }
  .themes { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .theme { background: var(--color-bg); color: var(--color-text); padding: var(--space-8); }
  h2 { font-size: var(--text-xl); line-height: var(--leading-xl); font-weight: 600; margin: 0 0 var(--space-6); }
  h3 { font-size: var(--text-xs); line-height: var(--leading-xs); font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .06em; margin: var(--space-8) 0 var(--space-4); }
  .row { display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: center; }
  svg.i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .btn { height: var(--size-control-md); padding: 0 12px; border-radius: var(--radius-sm); font: 500 var(--text-sm)/1 var(--font-sans); border: 1px solid transparent; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background var(--motion-fast) var(--motion-ease); }
  .btn:focus-visible, .ib:focus-visible, .field:focus-visible { outline: 2px solid var(--color-focus-ring); outline-offset: 1px; }
  .btn-primary { background: var(--color-accent); color: var(--color-on-accent); }
  .btn-primary:hover { background: var(--color-accent-hover); }
  .btn-secondary { background: var(--color-surface-raised); color: var(--color-text); border-color: var(--color-border); }
  .btn-ghost { background: transparent; color: var(--color-text); }
  .btn-ghost:hover, .btn-secondary:hover { background: var(--color-hover); }
  .btn-danger { background: transparent; color: var(--color-danger); border-color: var(--color-danger); }
  .btn[disabled] { color: var(--color-text-disabled); background: var(--color-surface); border-color: var(--color-border); cursor: default; }
  .btn-sm { height: var(--size-control-sm); padding: 0 8px; }
  .btn-lg { height: var(--size-control-lg); }
  .focus { outline: 2px solid var(--color-focus-ring); outline-offset: 1px; }
  .spin { width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; }

  .ib { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: var(--radius-sm); color: var(--color-text-muted); background: transparent; border: 0; }
  .ib:hover { background: var(--color-hover); color: var(--color-text); }
  .ib[aria-pressed="true"] { background: var(--color-selection-inactive); color: var(--color-text); }

  .kbd { display: inline-block; background: var(--color-surface-raised); border: 1px solid var(--color-border); border-radius: var(--radius-xs); font: var(--text-xs)/16px var(--font-mono); padding: 0 4px; color: var(--color-text-muted); }
  .badge { display: inline-flex; align-items: center; height: 16px; padding: 0 6px; border-radius: var(--radius-pill); font: 600 var(--text-2xs)/1 var(--font-sans); background: var(--color-surface-raised); color: var(--color-text-muted); }
  .badge.accent { background: var(--color-accent); color: var(--color-on-accent); }
  .badge.danger { background: var(--color-danger-bg); color: var(--color-danger); }
  .badge.warning { background: var(--color-warning-bg); color: var(--color-warning); }

  .field { height: var(--size-control-md); background: var(--color-editor-bg); color: var(--color-text); border: 1px solid var(--color-border-input); border-radius: var(--radius-sm); padding: 0 8px; font: var(--text-sm) var(--font-sans); width: 220px; }
  .field.error { border-color: var(--color-danger); }
  .field-msg { font-size: var(--text-xs); color: var(--color-danger); margin-top: 4px; }
  label.l { display: block; font-size: var(--text-xs); color: var(--color-text-muted); margin-bottom: 4px; }
  .check { display: inline-flex; gap: 6px; align-items: center; }
  .check input { accent-color: var(--color-accent); }

  /* IDE frame */
  .frame { border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; display: grid; grid-template-rows: var(--size-toolbar-h) 1fr var(--size-statusbar-h); height: 430px; }
  .toolbar { display: flex; align-items: center; gap: 4px; padding: 0 8px; border-bottom: 1px solid var(--color-border); }
  .tw-widget { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: var(--radius-sm); }
  .tw-widget:hover { background: var(--color-hover); }
  .tw-widget b { font-weight: 600; }
  .spacer { flex: 1; }
  .body { display: grid; grid-template-columns: var(--size-stripe-w) 230px 1fr; min-height: 0; }
  .stripe { display: flex; flex-direction: column; align-items: center; gap: 4px; padding-top: 6px; border-right: 1px solid var(--color-border); }
  .stripe .ib { width: 32px; height: 32px; position: relative; }
  .stripe .ib[aria-pressed="true"]::before { content: ""; position: absolute; left: -4px; top: 6px; bottom: 6px; width: 2px; background: var(--color-accent); border-radius: 2px; }
  .stripe .dot { position: absolute; right: 5px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--color-danger); }
  .tw { background: var(--color-surface); border-right: 1px solid var(--color-border); display: flex; flex-direction: column; min-width: 0; }
  .tw-head { height: 32px; display: flex; align-items: center; padding: 0 4px 0 10px; font-weight: 600; border-bottom: 1px solid var(--color-border); }
  .tree { list-style: none; margin: 0; padding: 4px 0; }
  .tree li { height: var(--size-row-h); display: flex; align-items: center; gap: 6px; padding-right: 8px; white-space: nowrap; }
  .tree li:hover { background: var(--color-hover); }
  .tree li.sel { background: var(--color-selection); }
  .tree .chev { width: 16px; color: var(--color-text-muted); }
  .tree .muted { color: var(--color-text-muted); }
  .tree .mod { color: var(--color-vcs-modified-text); }
  .tree .add { color: var(--color-vcs-added-text); }
  .tree .ign { color: var(--color-text-disabled); }
  .main { display: grid; grid-template-rows: var(--size-tab-h) 20px 1fr; min-width: 0; background: var(--color-editor-bg); position: relative; }
  .tabs { display: flex; background: var(--color-surface); border-bottom: 1px solid var(--color-border); }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 12px; color: var(--color-text-muted); border-right: 1px solid var(--color-border); }
  .tab.active { background: var(--color-editor-bg); color: var(--color-text); box-shadow: inset 0 -2px 0 var(--color-accent); }
  .tab.preview span { font-style: italic; }
  .tab .modified { width: 6px; height: 6px; border-radius: 50%; background: var(--color-text-muted); }
  .crumbs { font-size: var(--text-xs); color: var(--color-text-muted); padding: 2px 12px; }
  .crumbs b { color: var(--color-text); font-weight: 400; }
  .code { display: grid; grid-template-columns: 48px 1fr; font: var(--text-code)/var(--leading-code) var(--font-mono); overflow: hidden; }
  .gutter { text-align: right; padding-right: 12px; color: var(--color-line-number); position: relative; }
  .gutter div { position: relative; height: 20px; }
  .gutter .cur { color: var(--color-line-number-active); }
  .gutter .bp::before { content: ""; position: absolute; left: 4px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--color-breakpoint); }
  .gutter .vm::after, .gutter .va::after { content: ""; position: absolute; right: 2px; top: 0; bottom: 0; width: 3px; }
  .gutter .vm::after { background: var(--color-vcs-modified); }
  .gutter .va::after { background: var(--color-vcs-added); }
  .lines div { height: 20px; white-space: pre; padding-left: 4px; }
  .lines .cl { background: var(--color-editor-line); }
  .lines .exec { background: var(--color-warning-bg); }
  .k { color: var(--color-syntax-keyword); } .s { color: var(--color-syntax-string); } .n { color: var(--color-syntax-number); }
  .c { color: var(--color-syntax-comment); font-style: italic; } .t { color: var(--color-syntax-type); } .f { color: var(--color-syntax-function); }
  .a { color: var(--color-syntax-annotation); } .cn { color: var(--color-syntax-constant); }
  .sel-txt { background: var(--color-editor-selection); }
  .err { text-decoration: underline wavy var(--color-danger); text-underline-offset: 3px; }
  .warn { text-decoration: underline wavy var(--color-warning); text-underline-offset: 3px; }
  .unused { color: var(--color-text-disabled); }
  .inlay { color: var(--color-text-muted); background: var(--color-hover); border-radius: var(--radius-xs); font-size: 12px; padding: 0 3px; margin-right: 2px; }
  .caret { border-left: 2px solid var(--color-text); margin-left: -1px; }

  .popup { position: absolute; background: var(--color-surface-raised); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-pop); padding: 4px 0; }
  .popup .it { height: var(--size-row-h); display: flex; align-items: center; gap: 8px; padding: 0 10px; white-space: nowrap; }
  .popup .it.on { background: var(--color-selection); }
  .popup .it .r { margin-left: auto; color: var(--color-text-muted); padding-left: 24px; }
  .popup .it b { font-weight: 700; }
  .completion { left: 230px; top: 168px; width: 330px; font-family: var(--font-mono); font-size: var(--text-code); }
  .completion .ic { width: 16px; height: 16px; border-radius: 3px; display: grid; place-items: center; font: 600 10px/1 var(--font-sans); color: var(--color-bg); }
  .ic.m { background: var(--color-syntax-function); } .ic.fld { background: var(--color-syntax-constant); } .ic.cls { background: var(--color-syntax-type); }

  .status { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-top: 1px solid var(--color-border); font-size: var(--text-xs); color: var(--color-text-muted); }
  .status span { padding: 0 8px; }
  .status .prog { display: inline-flex; align-items: center; gap: 8px; }
  .status .bar { width: 80px; height: 2px; background: var(--color-border); position: relative; border-radius: 2px; }
  .status .bar::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 45%; background: var(--color-accent); border-radius: 2px; }

  .stack { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); align-items: start; }
  .menu { position: static; width: 240px; }
  .menu hr { border: 0; border-top: 1px solid var(--color-border); margin: 4px 0; }
  .menu .dis { color: var(--color-text-disabled); }
  .note { position: relative; width: 340px; background: var(--color-surface-raised); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-pop); padding: 12px; display: grid; grid-template-columns: 20px 1fr; gap: 4px 8px; }
  .note .tt { font-weight: 600; }
  .note .acts { grid-column: 2; display: flex; gap: 12px; margin-top: 4px; }
  .note a { color: var(--color-link); text-decoration: none; }
  .note.error .i { color: var(--color-danger); } .note.info .i { color: var(--color-info); } .note.warning .i { color: var(--color-warning); }
  .dialog { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-dialog); width: 100%; }
  .dialog .dh { padding: 14px 16px 6px; font: 600 var(--text-lg)/var(--leading-lg) var(--font-sans); }
  .dialog .db { padding: 6px 16px 14px; display: grid; gap: 10px; }
  .dialog .df { padding: 10px 16px; border-top: 1px solid var(--color-border); display: flex; gap: 8px; justify-content: flex-end; }
  .se { width: 100%; }
  .se .tabsrow { display: flex; gap: 2px; padding: 6px 8px 0; font-size: var(--text-xs); }
  .se .tabsrow span { padding: 4px 8px; border-radius: var(--radius-sm); color: var(--color-text-muted); }
  .se .tabsrow span.on { background: var(--color-selection-inactive); color: var(--color-text); }
  .se .in { margin: 6px 8px; height: 32px; border: 1px solid var(--color-focus-ring); border-radius: var(--radius-sm); display: flex; align-items: center; gap: 8px; padding: 0 8px; background: var(--color-editor-bg); font-size: var(--text-base); }
  .se .grp { font-size: var(--text-2xs); color: var(--color-text-muted); padding: 6px 10px 2px; text-transform: uppercase; letter-spacing: .06em; }
  .se .path { color: var(--color-text-muted); font-size: var(--text-xs); }
  .empty { color: var(--color-text-muted); text-align: center; padding: 24px; display: grid; gap: 8px; justify-items: center; }
</style>
</head>
<body>

<div class="themes">
<template id="tpl">
  <h2 class="ttl"></h2>

  <h3>Buttons</h3>
  <div class="row">
    <button class="btn btn-primary">Ausführen</button>
    <button class="btn btn-secondary">Abbrechen</button>
    <button class="btn btn-ghost">Mehr</button>
    <button class="btn btn-danger">Löschen</button>
    <button class="btn btn-secondary" disabled>Deaktiviert</button>
    <button class="btn btn-primary focus">Fokus</button>
    <button class="btn btn-primary" aria-busy="true"><span class="spin"></span>Lädt</button>
    <button class="btn btn-secondary btn-sm">sm 24</button>
    <button class="btn btn-secondary btn-lg">lg 32</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="ib" aria-label="Ausführen"><svg class="i"><use href="#play"/></svg></button>
    <button class="ib" aria-label="Debuggen"><svg class="i"><use href="#bug"/></svg></button>

  </div>

  <h3>Hauptfenster (S04): Toolbar, Stripe, Tool-Fenster, Tabs, Editor, Gutter, Completion, Statusleiste</h3>

    <div class="toolbar">
      <span class="tw-widget"><b>hello-world</b><svg class="i" style="width:12px"><use href="#chevd"/></svg></span>

    </div>
    <div class="body">
      <div class="stripe" role="toolbar" aria-label="Tool-Fenster">
        <button class="ib" aria-pressed="true" aria-label="Projekt"><svg class="i" style="width:20px;height:20px"><use href="#folder"/></svg></button>
        <button class="ib" aria-label="Commit"><svg class="i" style="width:20px;height:20px"><use href="#commit"/></svg></button>

        <div class="code">

          <div class="lines">
            <div><span class="k">package</span> com.example;</div>
            <div></div>
            <div><span class="k">import</span> <span class="unused">java.util.List</span>;</div>
            <div><span class="c">// Einstiegspunkt</span></div>
            <div class="exec"><span class="a">@SuppressWarnings</span>(<span class="s">"unused"</span>) <span class="k">public class</span> <span class="t">Main</span> {</div>

            <div>  <span class="k">public static void</span> <span class="f">main</span>(<span class="t">String</span>[] args) {</div>
            <div>    <span class="t">Greeter</span>.<span class="f">greet</span>(<span class="inlay">name:</span><span class="s">"Welt"</span>, <span class="inlay">times:</span><span class="n">2</span>);</div>
            <div>    <span class="sel-txt"><span class="k">int</span> count = </span><span class="err">undefinedVar</span>;  <span class="warn">System.out.println(count)</span></div>
            <div>  }</div>
          </div>

<section class="theme" data-theme="dark" id="dark"></section>
<section class="theme" data-theme="light" id="light"></section>
</div>
<script>
  // Render the same template into both theme sections. data-theme on a section
  // scopes the variables, so copy the light values onto that section.
  const tpl = document.getElementById('tpl');
  for (const id of ['dark', 'light']) {
    const el = document.getElementById(id);
    el.appendChild(tpl.content.cloneNode(true));
    el.querySelector('.ttl').textContent = id === 'dark' ? 'Dunkel (Standard)' : 'Hell';
  }
</script>
